[package]
name = "gwen"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "gwen"
path = "main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
gwen-md = { path = "../crates/gwen-md" }
gwen-pptx = { path = "../crates/gwen-pptx" }

[dev-dependencies]
serde_json = "1.0.151"
zip = { version = "8.6.0", features = ["deflate"] }