[package]
name = "gwen"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "gwen"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
miette = { version = "7.6.0", features = ["fancy"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
quick-xml = "0.42.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1"
zip = { version = "8.6.0", features = ["deflate"] }

[dev-dependencies]
ppt-rs = "0.2.26"
