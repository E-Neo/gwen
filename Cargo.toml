[package]
name = "gwen"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "gwen"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
clap = { version = "4.6.7", features = ["derive"] }
crc32fast = "1.5"
flate2 = "1.1"
harfrust = "0.15.0"
miette = { version = "7.6.0", features = ["fancy"] }
png = "0.18.1"
pulldown-cmark = { version = "0.13.5", default-features = false }
quick-xml = "0.42"
resvg = "0.48.1"
rquickjs = "0.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
skrifa = "0.49.0"
tiff = { version = "0.11.3", default-features = false, features = ["lzw", "deflate"] }
tiny-skia = "0.12.0"
toml = "1.1"
toml_edit = "0.25"
unicode-bidi = "0.3.18"
usvg = "0.48.1"
unicode-linebreak = "0.1.5"
unicode-script = "0.5.8"
zip = { version = "9", default-features = false, features = ["deflate"] }
