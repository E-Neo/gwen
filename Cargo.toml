[package]
name = "gwen"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "gwen"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
clap = { version = "4.6.7", features = ["derive"] }
crc32fast = "1.5"
flate2 = "1.1"
miette = { version = "7.6.0", features = ["fancy"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
rquickjs = "0.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1"
